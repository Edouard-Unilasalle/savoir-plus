<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Savoir+</title>
  <meta name="description" content="Un sujet par jour pour apprendre vraiment.">
  <meta name="theme-color" content="#0e0f13">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Savoir<span>+</span></div>
    <div class="topbar-right">
      <span class="streak" id="streak" title="Jours d'affilée">🔥 0</span>
      <button class="icon-btn" id="menuBtn" aria-label="Menu">☰</button>
    </div>
  </header>

  <main id="feed" class="feed" aria-live="polite">
    <section class="page loading"><div class="spinner"></div></section>
  </main>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <aside class="sheet" id="sheet" hidden aria-label="Menu">
    <div class="sheet-handle"></div>
    <div id="sheetContent"></div>
  </aside>

  <script src="app.js"></script>
</body>
</html>
